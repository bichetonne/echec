<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>biche_chess - Console</title>
    <style>
        :root {
            --bg-color: #16120e;
            --panel-bg: #231c15;
            --panel-border: #4a3826;
            --accent-color: #d4af37;
            --accent-hover: #e5c158;
            --text-color: #f0e6d2;
            --text-muted: #a39580;
            --input-bg: #120e0a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background-image: radial-gradient(circle at center, #231c15 0%, #16120e 100%);
        }

        .main-container {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--panel-border);
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        @media (min-width: 768px) {
            .main-container { padding: 30px; }
        }

        header { 
            text-align: center; 
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        @media (min-width: 768px) { header h1 { font-size: 2.2rem; } }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (min-width: 768px) { header p { font-size: 0.95rem; } }

        .section-title {
            font-size: 0.95rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 6px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .options-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        @media (min-width: 500px) {
            .options-group { grid-template-columns: repeat(3, 1fr); }
        }

        .options-group.colors {
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 500px) {
            .options-group.colors { flex-direction: row; }
        }

        .btn-option {
            padding: 12px 10px;
            border: 1px solid var(--panel-border);
            background: #2d241c;
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-align: center;
            touch-action: manipulation;
        }

        .btn-option:hover {
            background: #3a2f24;
            border-color: var(--accent-color);
        }

        .btn-option.active {
            border-color: var(--accent-color);
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent-color);
            box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .btn-start {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to bottom, #e5c158, #c59b27);
            color: #16120e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-start:hover {
            background: linear-gradient(to bottom, #f3cf66, #d4af37);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.3);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        input[type="text"]:focus { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        .btn-send {
            background: linear-gradient(to bottom, #e5c158, #c59b27) !important;
            color: #16120e !important;
            border: none !important;
        }

        .log-box {
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #d1c7b7;
            line-height: 1.6;
        }

        @media (min-width: 768px) {
            .log-box {
                height: 280px;
                font-size: 0.9rem;
            }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>♟️ biche_chess ♔</h1>
            <p id="headerSubtitle">Interface de combat tactique</p>
        </header>

        <!-- ÉCRAN DE CONFIGURATION -->
        <div id="setupScreen" style="display: flex; flex-direction: column; gap: 18px;">
            <div>
                <div class="section-title">1. Choisissez la difficulté du robot</div>
                <div class="options-group" id="difficultySelector">
                    <button class="btn-option active" data-diff="easy">Facile</button>
                    <button class="btn-option" data-diff="intermediate">Intermédiaire</button>
                    <button class="btn-option" data-diff="hard">Difficile</button>
                </div>
            </div>

            <div>
                <div class="section-title">2. Choisissez votre couleur</div>
                <div class="options-group colors" id="colorSelector">
                    <button class="btn-option active" style="flex:1;" data-color="white">Blancs (Vous commencez)</button>
                    <button class="btn-option" style="flex:1;" data-color="black">Noirs (Le robot commence)</button>
                </div>
            </div>

            <button class="btn-start" id="startBtn">Lancer la partie</button>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="gameScreen" class="hidden" style="display: flex; flex-direction: column; gap: 18px;">
            <div>
                <div class="section-title">Entrer votre coup</div>
                <div class="input-group">
                    <input type="text" id="moveInput" placeholder="ex: e2e4 ou E2E4">
                    <button class="btn-option btn-send" id="sendBtn" style="flex: 0; padding: 12px 18px;">Envoyer</button>
                </div>
            </div>

            <div>
                <div class="section-title">Journal de la partie</div>
                <div class="log-box" id="logBox">
                    [System] biche_chess initialisé. Prêt à jouer.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
    <script>
        let game = null;
        let currentDifficulty = 'easy';
        let playerColor = 'white';

        const pieceNamesFr = {
            'p': 'Pion', 'n': 'Cavalier', 'b': 'Fou', 'r': 'Tour', 'q': 'Dame', 'k': 'Roi'
        };

        const diffNames = {
            'easy': 'Facile',
            'intermediate': 'Intermédiaire',
            'hard': 'Difficile'
        };

        // Fonction d'initialisation sécurisée peu importe l'état du DOM
        function initApp() {
            const diffButtons = document.querySelectorAll('#difficultySelector .btn-option');
            diffButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    diffButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentDifficulty = this.getAttribute('data-diff');
                });
            });

            const colorButtons = document.querySelectorAll('#colorSelector .btn-option');
            colorButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    colorButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    playerColor = this.getAttribute('data-color');
                });
            });

            const startBtn = document.getElementById('startBtn');
            if (startBtn) startBtn.addEventListener('click', startNewGame);

            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) sendBtn.addEventListener('click', submitMove);

            const moveInput = document.getElementById('moveInput');
            if (moveInput) {
                moveInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        submitMove();
                    }
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        function log(message) {
            const logBox = document.getElementById('logBox');
            if (logBox) {
                logBox.innerHTML += `<br>${message}`;
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        function startNewGame() {
            if (typeof Chess === 'undefined') {
                alert("Erreur : La bibliothèque chess.js ne s'est pas chargée. Vérifiez votre connexion Internet.");
                return;
            }
            
            game = new Chess();
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            const colorName = playerColor === 'white' ? 'Blancs' : 'Noirs';
            
            document.getElementById('headerSubtitle').textContent = `Mode : ${diffNames[currentDifficulty]} | Vous jouez les ${colorName}`;
            document.getElementById('logBox').innerHTML = `[biche_chess] Partie lancée ! Difficulté : ${diffNames[currentDifficulty]}. Vous jouez les ${colorName}.`;

            if (playerColor === 'black') {
                triggerRobotTurn();
            }
        }

        function formatMoveDescription(moveObj, actor) {
            const pieceName = pieceNamesFr[moveObj.piece] || 'Pièce';
            const fromSq = moveObj.from;
            const toSq = moveObj.to;

            if (moveObj.captured) {
                const capturedName = pieceNamesFr[moveObj.captured] || 'pion';
                return `${actor} : ${pieceName} ${fromSq} en ${toSq} (capture ${capturedName})`;
            } else {
                return `${actor} : ${pieceName} ${fromSq} en ${toSq}`;
            }
        }

        function submitMove() {
            const input = document.getElementById('moveInput');
            if (!input) return;
            const moveStr = input.value.trim().toLowerCase();
            if (!moveStr || !game) return;

            try {
                let tempGameForHuman = new Chess(game.fen());
                let moveObj = tempGameForHuman.move(moveStr, { sloppy: true });
                
                if (moveObj === null) {
                    log(`❌ Coup illégal ou invalide : "${input.value}"`);
                    return;
                }

                game.move(moveStr, { sloppy: true });
                log(`👤 <b>${formatMoveDescription(moveObj, "Vous")}</b>`);
                input.value = '';

                if (game.game_over()) {
                    log(`🏁 Partie terminée ! Résultat : ${game.in_checkmate() ? 'Échec et mat' : 'Égalité'}`);
                    return;
                }

                triggerRobotTurn();

            } catch (e) {
                log(`❌ Erreur de format de coup.`);
            }
        }

        function triggerRobotTurn() {
            log(`<i>biche_chess réfléchit (${diffNames[currentDifficulty]})...</i>`);
            setTimeout(() => {
                if (!game) return;
                const possibleMoves = game.moves({ verbose: true });
                if (possibleMoves.length > 0) {
                    let chosenMoveObj = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                    game.move(chosenMoveObj);

                    const robotDesc = formatMoveDescription(chosenMoveObj, "🤖 biche_chess");
                    log(`<b>${robotDesc}</b>`);

                    if (game.game_over()) {
                        log(`🏁 Partie terminée ! Résultat : ${game.in_checkmate() ? 'Échec et mat' : 'Égalité'}`);
                    }
                }
            }, 600);
        }
    </script>
</body>
</html>
