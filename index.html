<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot d'Échecs - Console Interactive</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #c5a059;
            --accent-hover: #d4af37;
            --text-color: #e0e0e0;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-container {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1rem;
            color: var(--accent-color);
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
        }

        .btn-mode {
            flex: 1;
            padding: 10px 5px;
            border: 2px solid #444;
            background: #2a2a2a;
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-mode.active {
            border-color: var(--accent-color);
            background: rgba(197, 160, 89, 0.15);
            color: var(--accent-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn-action {
            padding: 12px 20px;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-action:hover {
            background-color: var(--accent-hover);
        }

        .log-box {
            background: #121212;
            border: 1px solid #333;
            border-radius: 8px;
            height: 280px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>🤖 Chess Robot Console</h1>
            <p>Journal d'échanges détaillé des mouvements</p>
        </header>

        <div>
            <div class="section-title">Difficulté du robot</div>
            <div class="mode-selector">
                <button class="btn-mode active" onclick="setMode('easy', this)">Facile</button>
                <button class="btn-mode" onclick="setMode('intermediate', this)">Intermédiaire</button>
                <button class="btn-mode" onclick="setMode('hard', this)">Difficile</button>
            </div>
        </div>

        <div>
            <div class="section-title">Entrer votre coup</div>
            <div class="input-group">
                <input type="text" id="moveInput" placeholder="ex: e2e4" onkeypress="checkEnter(event)">
                <button class="btn-action" onclick="submitMove()">Envoyer</button>
            </div>
        </div>

        <div>
            <div class="section-title">Journal de la partie</div>
            <div class="log-box" id="logBox">
                [System] Prêt. Mode Facile sélectionné.<br>
                [System] Entrez votre premier coup (ex: e2e4).
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        const game = new Chess();
        let currentDifficulty = 'easy';

        const pieceNamesFr = {
            'p': 'Pion',
            'n': 'Cavalier',
            'b': 'Fou',
            'r': 'Tour',
            'q': 'Dame',
            'k': 'Roi'
        };

        function log(message) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `<br>${message}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setMode(mode, btn) {
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentDifficulty = mode;
            
            const modeNames = {
                'easy': 'Facile',
                'intermediate': 'Intermédiaire',
                'hard': 'Difficile'
            };
            log(`[System] Mode basculé sur : ${modeNames[mode]}`);
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                submitMove();
            }
        }

        function formatMoveDescription(moveObj, actor) {
            const pieceName = pieceNamesFr[moveObj.piece] || 'Pièce';
            const fromSq = moveObj.from;
            const toSq = moveObj.to;

            if (moveObj.captured) {
                const capturedName = pieceNamesFr[moveObj.captured] || 'pion';
                return `${actor} : ${pieceName} ${fromSq} en ${toSq} (capture ${capturedName})`;
            } else {
                return `${actor} : ${pieceName} ${fromSq} en ${toSq}`;
            }
        }

        function submitMove() {
            const input = document.getElementById('moveInput');
            const moveStr = input.value.trim();
            if (!moveStr) return;

            try {
                let tempGameForHuman = new Chess(game.fen());
                let moveObj = tempGameForHuman.move(moveStr, { sloppy: true });
                
                if (moveObj === null) {
                    log(`❌ Coup illégal ou invalide : "${moveStr}"`);
                    return;
                }

                game.move(moveStr, { sloppy: true });
                log(`👤 <b>${formatMoveDescription(moveObj, "Vous")}</b>`);
                input.value = '';

                if (game.game_over()) {
                    log(`🏁 Partie terminée ! Résultat : ${game.in_checkmate() ? 'Échec et mat' : 'Égalité'}`);
                    return;
                }

                log(`<i>Le robot réfléchit (${currentDifficulty})...</i>`);
                setTimeout(() => {
                    // CORRECTION ICI : Utilisation de game.moves({ verbose: true }) à la place de verbose_moves()
                    const possibleMoves = game.moves({ verbose: true });
                    if (possibleMoves.length > 0) {
                        let chosenMoveObj = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                        game.move(chosenMoveObj);

                        const robotDesc = formatMoveDescription(chosenMoveObj, "🤖 Robot");
                        log(`<b>${robotDesc}</b>`);
                    }
                }, 600);

            } catch (e) {
                log(`❌ Erreur de format de coup.`);
            }
        }
    </script>
</body>
</html>
