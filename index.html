<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>biche_chess - Moniteur Tactique</title>
    <style>
        :root {
            --bg-color: #16120e;
            --panel-bg: #231c15;
            --panel-border: #4a3826;
            --accent-color: #d4af37;
            --accent-hover: #e5c158;
            --text-color: #f0e6d2;
            --text-muted: #a39580;
            --input-bg: #120e0a;
            
            --log-panel-bg: rgba(35, 28, 21, 0.85);
            --log-border: rgba(74, 56, 38, 0.7);
            --log-text: #d1c7b7;
            --log-highlight: rgba(212, 175, 55, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background-image: radial-gradient(circle at center, #231c15 0%, #16120e 100%);
        }

        .main-container {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--panel-border);
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        @media (min-width: 768px) {
            .main-container { padding: 30px; }
        }

        header { 
            text-align: center; 
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        @media (min-width: 768px) { header h1 { font-size: 2.2rem; } }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (min-width: 768px) { header p { font-size: 0.95rem; } }

        .section-title {
            font-size: 0.95rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 6px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .slider-box {
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skill-slider {
            width: 100%;
            -webkit-appearance: none;
            background: #16120e;
            height: 8px;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
            outline: none;
        }

        .skill-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
            transition: transform 0.2s;
        }

        .skill-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: var(--accent-hover);
        }

        .slider-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        #sliderValueDisplay {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.05rem;
        }

        .options-group {
            display: flex;
            gap: 8px;
        }

        .btn-option {
            flex: 1;
            padding: 12px 10px;
            border: 1px solid var(--panel-border);
            background: #2d241c;
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-align: center;
            touch-action: manipulation;
        }

        .btn-option:hover {
            background: #3a2f24;
            border-color: var(--accent-color);
        }

        .btn-option.active {
            border-color: var(--accent-color);
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent-color);
            box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .btn-start {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to bottom, #e5c158, #c59b27);
            color: #16120e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-start:hover {
            background: linear-gradient(to bottom, #f3cf66, #d4af37);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.3);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        input[type="text"]:focus { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        .btn-send {
            background: linear-gradient(to bottom, #e5c158, #c59b27) !important;
            color: #16120e !important;
            border: none !important;
        }

        .log-box {
            background-color: var(--log-panel-bg);
            border: 1px solid var(--log-border);
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            color: var(--log-text);
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        .log-header {
            display: grid;
            grid-template-columns: 50px 1fr 1fr;
            padding: 8px 10px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid var(--log-border);
            font-weight: bold;
            color: var(--accent-color);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
        }

        .log-entries {
            display: flex;
            flex-direction: column;
        }

        .log-entry {
            display: grid;
            grid-template-columns: 50px 1fr 1fr;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(74, 56, 38, 0.2);
            font-size: 0.9rem;
            align-items: center;
        }

        .log-entry:nth-child(even) {
            background-color: var(--log-highlight);
        }

        .log-move-num {
            color: var(--text-muted);
            text-align: center;
            font-weight: bold;
        }

        .chess-symbol {
            font-size: 1.2rem;
            margin-right: 6px;
            vertical-align: middle;
        }
        .piece-white {
            color: #e5c158;
            text-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
        .piece-black {
            color: #c59b27;
            text-shadow: 0 0 2px rgba(0,0,0,0.8);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>♟️ biche_chess ♔</h1>
            <p id="headerSubtitle">Moniteur Tactique</p>
        </header>

        <!-- ÉCRAN DE CONFIGURATION -->
        <div id="setupScreen" style="display: flex; flex-direction: column; gap: 18px;">
            <div>
                <div class="section-title">1. Niveau de difficulté (Style Chess.com)</div>
                <div class="slider-box">
                    <input type="range" id="skillSlider" min="1" max="20" value="5" class="skill-slider">
                    <div class="slider-info">
                        <span>Niv. 1 (250 Elo)</span>
                        <span id="sliderValueDisplay">Niveau 5 (1000 Elo)</span>
                        <span>Niv. 20 (3200 Elo)</span>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">2. Choisissez votre couleur</div>
                <div class="options-group colors" id="colorSelector">
                    <button class="btn-option active" data-color="white">Blancs (Vous commencez)</button>
                    <button class="btn-option" data-color="black">Noirs (Le robot commence)</button>
                </div>
            </div>

            <button class="btn-start" id="startBtn">Lancer la partie</button>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="gameScreen" class="hidden" style="display: flex; flex-direction: column; gap: 18px;">
            <div>
                <div class="section-title">Entrer votre coup</div>
                <div class="input-group">
                    <input type="text" id="moveInput" placeholder="ex: e2e4 ou E2E4">
                    <button class="btn-option btn-send" id="sendBtn" style="flex: 0; padding: 12px 18px;">Envoyer</button>
                </div>
            </div>

            <div>
                <div class="section-title">Journal Tactique</div>
                <div class="log-box" id="logBox">
                    <div class="log-header">
                        <div>Tour</div>
                        <div>Vous</div>
                        <div>biche_chess</div>
                    </div>
                    <div class="log-entries" id="logEntries"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
    <script>
        let game = null;
        let currentSkillLevel = 5;
        let playerColor = 'white';

        // Correspondance style Chess.com pour chaque niveau de 1 à 20
        const chessComEloMap = {
            1: "250 Elo",
            2: "400 Elo",
            3: "600 Elo",
            4: "800 Elo",
            5: "1000 Elo",
            6: "1200 Elo",
            7: "1400 Elo",
            8: "1550 Elo",
            9: "1700 Elo",
            10: "1850 Elo",
            11: "2000 Elo",
            12: "2150 Elo",
            13: "2300 Elo",
            14: "2450 Elo",
            15: "2600 Elo",
            16: "2750 Elo",
            17: "2850 Elo",
            18: "2950 Elo",
            19: "3050 Elo",
            20: "3200 Elo (Max)"
        };

        const pieceNamesFr = {
            'p': 'Pion', 'n': 'Cavalier', 'b': 'Fou', 'r': 'Tour', 'q': 'Dame', 'k': 'Roi'
        };

        const whiteSymbols = { 'p': '♙', 'n': '♘', 'b': '♗', 'r': '♖', 'q': '♕', 'k': '♔' };
        const blackSymbols = { 'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚' };

        function initApp() {
            const slider = document.getElementById('skillSlider');
            const sliderDisplay = document.getElementById('sliderValueDisplay');
            if (slider) {
                slider.addEventListener('input', function() {
                    currentSkillLevel = parseInt(this.value);
                    const eloText = chessComEloMap[currentSkillLevel] || "";
                    sliderDisplay.textContent = `Niveau ${currentSkillLevel} (${eloText})`;
                });
            }

            const colorButtons = document.querySelectorAll('#colorSelector .btn-option');
            colorButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    colorButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    playerColor = this.getAttribute('data-color');
                });
            });

            const startBtn = document.getElementById('startBtn');
            if (startBtn) startBtn.addEventListener('click', startNewGame);

            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) sendBtn.addEventListener('click', submitMove);

            const moveInput = document.getElementById('moveInput');
            if (moveInput) {
                moveInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') submitMove();
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        function startNewGame() {
            if (typeof Chess === 'undefined') {
                alert("Erreur : La bibliothèque chess.js ne s'est pas chargée.");
                return;
            }
            
            game = new Chess();
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            const colorName = playerColor === 'white' ? 'Blancs' : 'Noirs';
            const eloText = chessComEloMap[currentSkillLevel];
            document.getElementById('headerSubtitle').textContent = `Niveau ${currentSkillLevel} (${eloText}) | Vous jouez les ${colorName}`;
            document.getElementById('logEntries').innerHTML = '';

            if (playerColor === 'black') {
                triggerRobotTurn();
            }
        }

        function logMoveToTacticalView(moveObj) {
            const logEntries = document.getElementById('logEntries');
            const history = game.history({ verbose: true });
            const turnNum = Math.ceil(history.length / 2);
            
            let row = document.getElementById(`turn-${turnNum}`);
            if (!row) {
                row = document.createElement('div');
                row.classList.add('log-entry');
                row.id = `turn-${turnNum}`;
                row.innerHTML = `
                    <div class="log-move-num">${turnNum}.</div>
                    <div id="white-move-${turnNum}">-</div>
                    <div id="black-move-${turnNum}">-</div>
                `;
                logEntries.appendChild(row);
            }

            const pieceType = moveObj.piece;
            const isWhite = moveObj.color === 'w';
            const symbol = isWhite ? whiteSymbols[pieceType] : blackSymbols[pieceType];
            const colorClass = isWhite ? 'piece-white' : 'piece-black';
            const pieceName = pieceNamesFr[pieceType] || 'Pièce';
            
            let actionText = `${pieceName} ${moveObj.from} en ${moveObj.to}`;
            if (moveObj.captured) {
                const capturedName = pieceNamesFr[moveObj.captured] || 'pion';
                actionText += ` (cap. ${capturedName})`;
            }

            const content = `<span class="chess-symbol ${colorClass}">${symbol}</span>${actionText}`;

            if (isWhite) {
                document.getElementById(`white-move-${turnNum}`).innerHTML = content;
            } else {
                document.getElementById(`black-move-${turnNum}`).innerHTML = content;
            }
            
            const logBox = document.getElementById('logBox');
            logBox.scrollTop = logBox.scrollHeight;
        }

        function submitMove() {
            const input = document.getElementById('moveInput');
            if (!input) return;
            const moveStr = input.value.trim().toLowerCase();
            if (!moveStr || !game) return;

            try {
                let tempGameForHuman = new Chess(game.fen());
                let moveObj = tempGameForHuman.move(moveStr, { sloppy: true });
                
                if (moveObj === null) {
                    alert(`Coup illégal ou invalide : "${input.value}"`);
                    return;
                }

                game.move(moveStr, { sloppy: true });
                logMoveToTacticalView(moveObj);
                input.value = '';

                if (game.game_over()) {
                    alert(`Partie terminée ! ${game.in_checkmate() ? 'Échec et mat' : 'Égalité'}`);
                    return;
                }

                triggerRobotTurn();

            } catch (e) {
                alert(`Erreur de format de coup.`);
            }
        }

        function triggerRobotTurn() {
            setTimeout(() => {
                if (!game) return;
                const possibleMoves = game.moves({ verbose: true });
                if (possibleMoves.length > 0) {
                    let chosenMoveObj = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                    game.move(chosenMoveObj);
                    logMoveToTacticalView(chosenMoveObj);

                    if (game.game_over()) {
                        alert(`Partie terminée ! ${game.in_checkmate() ? 'Échec et mat' : 'Égalité'}`);
                    }
                }
            }, 600);
        }
    </script>
</body>
</html>
