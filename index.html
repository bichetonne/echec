<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot d'Échecs - Console</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #c5a059;
            --accent-hover: #d4af37;
            --text-color: #e0e0e0;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-container {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1rem;
            color: var(--accent-color);
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
        }

        .btn-mode {
            flex: 1;
            padding: 10px 5px;
            border: 2px solid #444;
            background: #2a2a2a;
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-mode.active {
            border-color: var(--accent-color);
            background: rgba(197, 160, 89, 0.15);
            color: var(--accent-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn-action {
            padding: 12px 20px;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-action:hover {
            background-color: var(--accent-hover);
        }

        .log-box {
            background: #121212;
            border: 1px solid #333;
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>🤖 Chess Robot Console</h1>
            <p>Interface textuelle de pilotage de votre robot</p>
        </header>

        <!-- Sélection de la difficulté -->
        <div>
            <div class="section-title">Difficulté du robot</div>
            <div class="mode-selector">
                <button class="btn-mode active" onclick="setMode('easy', this)">Facile</button>
                <button class="btn-mode" onclick="setMode('intermediate', this)">Intermédiaire</button>
                <button class="btn-mode" onclick="setMode('hard', this)">Difficile</button>
            </div>
        </div>

        <!-- Zone de saisie du coup -->
        <div>
            <div class="section-title">Entrer votre coup</div>
            <div class="input-group">
                <input type="text" id="moveInput" placeholder="ex: e2e4" onkeypress="checkEnter(event)">
                <button class="btn-action" onclick="submitMove()">Envoyer</button>
            </div>
        </div>

        <!-- Journal de la partie -->
        <div>
            <div class="section-title">Journal de la partie</div>
            <div class="log-box" id="logBox">
                [System] Prêt. Mode Facile sélectionné par défaut.<br>
                [System] Entrez votre premier coup (ex: e2e4).
            </div>
        </div>
    </div>

    <!-- Bibliothèque de gestion des échecs (utilisée en arrière-plan) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        const game = new Chess();
        let currentDifficulty = 'easy';

        function log(message) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `<br>${message}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setMode(mode, btn) {
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentDifficulty = mode;
            
            const modeNames = {
                'easy': 'Facile (Erreurs fréquentes / Niveau débutant)',
                'intermediate': 'Intermédiaire (Niveau modéré)',
                'hard': 'Difficile (Pleine puissance)'
            };
            log(`[System] Difficulté changée : ${modeNames[mode]}`);
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                submitMove();
            }
        }

        function submitMove() {
            const input = document.getElementById('moveInput');
            const moveStr = input.value.trim();
            if (!moveStr) return;

            try {
                let move = game.move(moveStr, { sloppy: true });
                
                if (move === null) {
                    log(`❌ Coup illégal ou invalide : "${moveStr}"`);
                    return;
                }

                log(`👤 Vous : <b>${move.san}</b> (${moveStr})`);
                input.value = '';

                if (game.game_over()) {
                    log(`🏁 Partie terminée ! Résultat : ${game.in_checkmate() ? 'Échec et mat' : 'Égalité'}`);
                    return;
                }

                // Simulation de la réponse du robot selon la difficulté
                log(`🤖 Le robot réfléchit (${currentDifficulty})...`);
                setTimeout(() => {
                    const possibleMoves = game.moves();
                    if (possibleMoves.length > 0) {
                        let chosenMove;
                        
                        // En mode facile, le robot choisit souvent un coup aléatoire ou moins optimisé
                        if (currentDifficulty === 'easy') {
                            chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                        } else {
                            // Simulation pour les autres modes (prend le premier pour l'exemple front-end)
                            chosenMove = possibleMoves[0];
                        }

                        game.move(chosenMove);
                        log(`🤖 Robot : <b>${chosenMove}</b>`);
                    }
                }, 600);

            } catch (e) {
                log(`❌ Erreur de format de coup.`);
            }
        }
    </script>
</body>
</html>
